variables:
  HARBOR_REGISTRY: harbor.platform.local
  HARBOR_PROJECT: app
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  GITOPS_REPO: https://root:${GITLAB_TOKEN}@gitlab.platform.local/root/observability-demo-gitops.git

stages:
  - build
  - update-gitops

# ── be-auth ────────────────────────────────────────────────────────────────
build-be-auth:
  stage: build
  image:
    name: harbor.platform.local/app/kaniko:debug
    entrypoint: [""]
  rules:
    - changes:
        - service/be-auth/**/*
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"auth\":\"$(echo -n admin:Harbor12345 | base64)\"}}}" > /kaniko/.docker/config.json
    - cp /etc/ssl/certs/ca-certificates.crt /kaniko/ssl/certs/ca-certificates.crt 2>/dev/null || true
  script:
    - >-
      /kaniko/executor
      --context $CI_PROJECT_DIR/service/be-auth
      --dockerfile $CI_PROJECT_DIR/service/be-auth/Dockerfile
      --destination $HARBOR_REGISTRY/$HARBOR_PROJECT/be-auth:$IMAGE_TAG
      --destination $HARBOR_REGISTRY/$HARBOR_PROJECT/be-auth:latest
      --skip-tls-verify
      --cache=true
      --cache-repo=$HARBOR_REGISTRY/$HARBOR_PROJECT/cache-be-auth
  tags: []

update-gitops-be-auth:
  stage: update-gitops
  image:
    name: harbor.platform.local/dockerhub/library/alpine:3.19
    entrypoint: [""]
  rules:
    - changes:
        - service/be-auth/**/*
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab.platform.local"
    - git config --global user.name "GitLab CI"
    - git config --global http.sslVerify false
  script:
    - git clone $GITOPS_REPO gitops
    - cd gitops
    - sed -i "s|harbor.platform.local/app/be-auth:.*|harbor.platform.local/app/be-auth:$IMAGE_TAG|g" apps/be-auth/deployment.yaml
    - git add apps/be-auth/deployment.yaml
    - 'git commit -m "ci: update be-auth image to $IMAGE_TAG"'
    - git push origin main
  tags: []

